# ── Security headers (didefinisikan sekali, dipakai di dua tempat karena
#    add_header nginx TIDAK di-inherit jika location punya add_header sendiri)
map $sent_http_content_type $csp_header {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Jangan bocorkan versi nginx di header/error pages
    server_tokens off;

    # Batasi ukuran request body (frontend statis tidak menerima upload)
    client_max_body_size 1m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy    $csp_header always;

    # SPA fallback — semua route diarahkan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets agresif — security headers DIULANG di sini
    # karena add_header di level location membatalkan inheritance
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control              "public, immutable";
        add_header X-Frame-Options            "SAMEORIGIN" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy    $csp_header always;
    }

    # Blokir akses file tersembunyi (.git, .env, dsb) jika ikut ter-copy
    location ~ /\. {
        deny all;
        return 404;
    }
}
