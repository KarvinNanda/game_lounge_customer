name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Node.js setup ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── Dependencies ──────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Security audit ────────────────────────────────────────────────────────
      # Gagalkan build jika ada vulnerability high/critical di runtime deps
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # ── Unit Tests ────────────────────────────────────────────────────────────
      - name: Run unit tests
        run: npm run test:run

      # ── Coverage ──────────────────────────────────────────────────────────────
      - name: Generate coverage report
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build
        run: npm run build
        env:
          # Prevent build failure on warnings treated as errors
          CI: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
